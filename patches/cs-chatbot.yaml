repo: cs-chatbot
overlay: lsi
layout: lsi
canonical: .lsi/workflows
audit_resolutions: patches/files/cs-chatbot/audit-resolutions.yaml
project:
  REPO_NAME: cs-chatbot
  TITLE_PREFIX: "CS Chatbot | "
  BASE_BRANCH: main
  PR_TARGET_BRANCH: staging
  PROTECTED_BRANCHES: "main, staging"
  SOURCE_ROOT: "app/"
  TEST_ROOT: "tests/"
  TEST_COMMAND: "uv run pytest"
  PR_HOST: Bitbucket
  BITBUCKET_REMOTE: lsistreaming/cs-chatbot
  VERSION_FILE: VERSION
  PR_WARN_FILES: "15"
  PR_MAX_FILES: "25"
  PR_WARN_LINES: "250"
  PR_MAX_LINES: "400"
  PR_MAX_COMMITS: "12"
  PR_MAX_PRIMARY_CONCERNS: "1"
  PR_MAX_SCOPES: "3"
overlay_files:
  ticket-card-info.md: patches/files/cs-chatbot/ticket-card-info.md
  test-requirements.md: patches/files/cs-chatbot/test-requirements.md
  versioning-and-releases.md: patches/files/cs-chatbot/versioning-and-releases.md
  openspec-git-integration.md: patches/files/cs-chatbot/openspec-git-integration.md
preserve:
  - bitbucket-pipelines.yml
  - DECISIONS.md
  - openspec/
  - .lsi/docs/
  - .cursor/skills/
  - .claude/skills/
  - .cursor/commands/opsx-*.md
  - .claude/commands/opsx/
agents_claude:
  canonical: AGENTS.md
  claude_symlink: true
  reconcile_sources:
    - CLAUDE.md
merge:
  AGENTS.md:
    markers: [lsi:workflows, lsi:domain]
  cursorrules:
    marker_block: lsi:workflows
bootstrap:
  VERSION: "0.1.0"
  VERSION_FILE: VERSION
ci_hook:
  add_check_version: true
