# WordPress Recurly checkout plugin — lsistreaming/recurly_wp_plugin
# Workspace path in this clone layout: ../recurly_wp_plugin
repo: recurly_wp_plugin
overlay: lsi
layout: lsi
canonical: .lsi/workflows
audit_resolutions: patches/files/recurly_wp_plugin/audit-resolutions.yaml

project:
  REPO_NAME: recurly_wp_plugin
  TITLE_PREFIX: "Recurly WP | "
  BASE_BRANCH: main
  PR_TARGET_BRANCH: staging
  PROTECTED_BRANCHES: "main, staging, master"
  SOURCE_ROOT: "includes/, admin/, public/, wp-lsi-recurly.php"
  TEST_ROOT: tests/
  TEST_COMMAND: "php -l wp-lsi-recurly.php"
  TICKET_TOOL: Trello
  TICKET_ID_PATTERN: 24-character hex id
  BRANCH_PATTERN: "feature|bugfix|hotfix|chore/{24-char-id}-slug"
  PR_HOST: Bitbucket
  BITBUCKET_REMOTE: lsistreaming/recurly_wp_plugin
  VERSION_FILE: version.txt
  PR_WARN_FILES: "15"
  PR_WARN_LINES: "250"
  PR_MAX_FILES: "25"
  PR_MAX_LINES: "400"
  PR_MAX_COMMITS: "12"
  PR_MAX_PRIMARY_CONCERNS: "1"
  PR_MAX_SCOPES: "3"

scope_exclude_globs:
  - composer.lock
  - package-lock.json
  - composer.phar

preserve:
  - bitbucket-pipelines.yml
  - PROJECT.md
  - README.md
  - AGENTS.md
  - openspec/**
  - docs/sdlc/bitbucket.md
  - docs/deployment/secrets.md
  - .cursor/commands/opsx-*.md
  - .cursor/skills/**
  - .claude/commands/opsx/**
  - .claude/skills/**

overlay_files:
  openspec-git-integration.md: patches/files/recurly_wp_plugin/openspec-git-integration.md
  ticket-card-info.md: patches/files/recurly_wp_plugin/ticket-card-info.md
  test-requirements.md: patches/files/recurly_wp_plugin/test-requirements.md
  versioning-and-releases.md: patches/files/recurly_wp_plugin/versioning-and-releases.md

agents_claude:
  canonical: AGENTS.md
  claude_symlink: true
  reconcile_sources:
    - CLAUDE.md

merge:
  AGENTS.md:
    markers: [lsi:workflows, lsi:domain]
  cursorrules:
    marker_block: lsi:workflows

bootstrap:
  version.txt: "1.0.1"

ci_hook:
  add_check_version: true
